  /api/v1/projects/{project}/documents:
    get:
      tags: [Documentos]
      summary: Conteúdo de uma pasta (ou raiz), ou pesquisa em toda a obra (documents.view)
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: folder_id, in: query, schema: { type: integer } }
        - { name: search, in: query, description: "Título ou nome do ficheiro, em todas as pastas", schema: { type: string } }
        - { name: tree, in: query, description: "1 = inclui todas as pastas da obra (para mover)", schema: { type: integer } }
      responses: { "200": { description: "{folder, path, folders, documents, tree?}" } }
    post:
      tags: [Documentos]
      summary: Enviar documento, cria a v1 (documents.upload); multipart
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
