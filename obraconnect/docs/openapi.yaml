components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: obraconnect-session
      description: Cookie de sessão Laravel + cabeçalho X-XSRF-TOKEN nas escritas.
  responses:
    Validation:
      description: Erro de validação
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  schemas:
    Plan:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        price_monthly_cents: { type: [integer, "null"] }
        price_yearly_cents: { type: [integer, "null"] }
        currency: { type: string }
        prices_exclude_vat: { type: boolean }
        trial_days: { type: integer }
        limits: { type: object, additionalProperties: { type: [integer, "null"] } }
        features: { type: array, items: { type: string } }
    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        legal_name: { type: [string, "null"] }
        nif: { type: [string, "null"] }
        status: { type: string, enum: [active, read_only, suspended] }
        logo_url: { type: [string, "null"] }
        settings: { type: object, properties: { timezone: { type: string }, require_mfa: { type: boolean } } }
        storage_used_bytes: { type: integer }
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            email_verified: { type: boolean }
            two_factor_enabled: { type: boolean }
            platform_role: { type: [string, "null"], enum: [super_admin, support, billing, null] }
        tenants: { type: array, items: { type: object } }
        current:
          type: [object, "null"]
          properties:
            tenant: { type: object }
            role: { type: object }
            permissions: { type: array, items: { type: string } }
            subscription: { type: [object, "null"] }
        support_session: { type: [object, "null"] }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        permissions: { type: array, items: { type: string, example: members.view } }
    ProjectInput:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        code: { type: [string, "null"], maxLength: 30, description: Vazio na criação = OB-AAAA-NNN }
        owner_name: { type: [string, "null"] }
        type: { type: [string, "null"], enum: [new_build, renovation, extension, demolition, infrastructure, maintenance, other, null] }
        address: { type: [string, "null"] }
        postal_code: { type: [string, "null"] }
        city: { type: [string, "null"] }
        contract_value_cents: { type: [integer, "null"], description: "Sem IVA, em cêntimos" }
        starts_on: { type: [string, "null"], format: date }
        planned_end_on: { type: [string, "null"], format: date }
        status: { type: string, enum: [planning, active, suspended, completed, archived] }
        description: { type: [string, "null"] }
    DiaryEntryInput:
      type: object
      properties:
        entry_date: { type: string, format: date, description: Só na criação }
        weather:
          type: [object, "null"]
          properties:
            morning: { type: [string, "null"], enum: [limpo, nublado, chuva, chuva_forte, vento, nevoeiro, geada, neve, null] }
            afternoon: { type: [string, "null"] }
            temp_min: { type: [integer, "null"] }
            temp_max: { type: [integer, "null"] }
        work_summary: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [kind, description]
            properties:
              kind: { type: string, enum: [workforce, equipment, material, incident, visit] }
              description: { type: string }
              quantity: { type: [number, "null"] }
              unit: { type: [string, "null"] }
              company: { type: [string, "null"] }
              location_id: { type: [integer, "null"] }
              element_id: { type: [integer, "null"] }
