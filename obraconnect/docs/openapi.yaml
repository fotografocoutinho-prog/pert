                title: { type: string, description: "Por omissão, o nome do ficheiro" }
                folder_id: { type: integer }
                description: { type: string }
                note: { type: string }
      responses: { "201": { description: Documento com versões }, "402": { description: PLAN_LIMIT_REACHED (storage_mb) }, "409": { description: PROJECT_ARCHIVED }, "422": { description: Tipo ou tamanho } }
