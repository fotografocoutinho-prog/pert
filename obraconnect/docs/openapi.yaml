openapi: 3.1.0
info:
  title: ObraConnect API
  version: 0.16.0
  description: |
    API REST v1 do ObraConnect (fase 1 — fundação; fase 2 — obras e diário de obra).

    **Autenticação.** A SPA usa sessão por cookie (Laravel Sanctum): `GET /sanctum/csrf-cookie`,
    depois `POST /auth/login` com o cabeçalho `X-XSRF-TOKEN`. Integrações futuras usarão tokens Bearer (Sanctum).

    **Empresa ativa.** As rotas de empresa usam sempre a empresa ativa da conta (`users.current_tenant_id`),
    validada no servidor. Nenhum parâmetro ou cabeçalho escolhe a empresa. Para mudar: `POST /api/v1/me/tenants/{id}/switch`.

    **Erros.** `{"message": "...", "code": "CODIGO"}`. Validação (422): `{"message", "errors": {"campo": ["..."]}}`.
    Códigos: `NO_TENANT`, `TENANT_SUSPENDED` (423), `TENANT_READ_ONLY` (423), `MFA_REQUIRED`, `PLAN_LIMIT_REACHED` (402),
    `ROLE_ESCALATION`, `LAST_ADMIN`, `ALREADY_MEMBER`, `INVITATION_PENDING`, `INVITATION_INVALID`, `ROLE_LOCKED`,
    `ROLE_IN_USE`, `PLATFORM_ONLY`, `PLATFORM_ROLE`, `SUPPORT_GRANT_INVALID`, `SUPPORT_READ_ONLY`, `EXPORT_RUNNING`,
    `PROJECT_ARCHIVED` (409), `ALREADY_IN_TEAM` (409), `MEMBERSHIP_INACTIVE`, `DIARY_SUBMITTED` (409).

    **Modo sem rede.** POST de registos do diário e de fotografias aceitam client_uuid (UUID criado no telemóvel):
    um reenvio com o mesmo client_uuid devolve o que já existe (200), sem duplicar nem contar duas vezes na quota.

    **Ligação à estrutura.** Linhas do diário (`items.*`), fotografias e documentos aceitam `location_id` e/ou
    `element_id` da mesma obra; com elemento, `location_id` passa a ser o do elemento. Locais e elementos com
    ligações não se apagam (`LOCATION_IN_USE`, `ELEMENT_IN_USE`, 409).

    **Fotografias.** Os ficheiros nunca têm endereço público: `GET /api/v1/projects/{project}/media/{media}/{thumb|preview|original}`
    exige sessão e `diary.view` na obra. O original é devolvido sem alterações (o `sha256` da resposta confirma-o).

    **Permissões de obra.** `projects.*` e `diary.*` (exceto `projects.all` e `projects.create`) decidem-se obra a obra:
    valem em todas as obras se o perfil na empresa tiver `projects.all`; senão, só nas obras de cuja equipa a pessoa faz
    parte, com o perfil que tem nessa equipa. Cada obra devolve em `permissions` o que quem pede pode fazer nela.
  license:
    name: Proprietária
servers:
  - url: https://app.exemplo.pt
security:
  - sessionCookie: []
tags:
  - name: Autenticação
  - name: Conta
  - name: Empresa
  - name: Utilizadores
  - name: Perfis
  - name: Auditoria
  - name: Subscrição
  - name: Suporte
  - name: Exportação
  - name: Obras
  - name: Diário de obra
  - name: Documentos
  - name: Estrutura
  - name: Organização
  - name: Inspeções
  - name: Ocorrências
  - name: Clientes
  - name: Calendários
  - name: Orçamentos
  - name: Medições e autos
  - name: Compras e subempreitadas
  - name: Horas e equipamentos
  - name: Custos
  - name: Planeamento
  - name: Pré-faturação
  - name: Faturas de fornecedores
  - name: Plataforma
paths:
  /api/v1/health:
    get:
      tags: [Conta]
      summary: Estado do serviço
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  database: { type: string, enum: [ok, error] }
        "503": { description: Base de dados indisponível }
  /api/v1/plans:
    get:
      tags: [Subscrição]
      summary: Planos públicos (preços sem IVA)
      security: []
      responses:
        "200":
          description: Lista de planos
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } } }

  /auth/register:
    post:
      tags: [Autenticação]
      summary: Registar conta (cria empresa, ou junta-se a uma empresa com convite)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, accept_terms]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, description: Letras e números }
                password_confirmation: { type: string }
                accept_terms: { type: boolean }
                company_name: { type: string, description: Obrigatório sem convite }
                nif: { type: string, description: NIF português (validado) }
                invitation_token: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "201": { description: Conta criada e sessão iniciada }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                remember: { type: boolean }
      responses:
        "200":
          description: "`two_factor: true` se for preciso o código 2FA em /auth/two-factor-challenge"
          content:
            application/json:
              schema: { type: object, properties: { two_factor: { type: boolean } } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { description: Demasiadas tentativas }
  /auth/two-factor-challenge:
    post:
      tags: [Autenticação]
      summary: Código 2FA ou código de recuperação
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                recovery_code: { type: string }
      responses:
        "204": { description: Sessão iniciada }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/logout:
    post: { tags: [Autenticação], summary: Terminar sessão, responses: { "204": { description: OK } } }
  /auth/forgot-password:
    post:
      tags: [Autenticação]
      summary: Pedir ligação de recuperação (resposta idêntica exista ou não o email)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }
      responses: { "200": { description: Mensagem neutra } }
  /auth/reset-password:
    post:
      tags: [Autenticação]
      summary: Definir nova password com o token recebido por email
      security: []
      responses: { "200": { description: OK }, "422": { $ref: "#/components/responses/Validation" } }
  /auth/user/two-factor-authentication:
    post: { tags: [Autenticação], summary: Ativar 2FA (exige password confirmada), responses: { "200": { description: OK }, "423": { description: Confirmar password primeiro } } }
    delete: { tags: [Autenticação], summary: Desativar 2FA, responses: { "200": { description: OK } } }
  /auth/user/confirmed-two-factor-authentication:
    post: { tags: [Autenticação], summary: Confirmar 2FA com um código, responses: { "200": { description: OK } } }

  /api/v1/me:
    get:
      tags: [Conta]
      summary: Sessão atual (utilizador, empresas, empresa ativa, permissões, sessão de suporte)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Me" } } } } }
        "401": { description: Sem sessão }
  /api/v1/me/tenants/{tenantId}/switch:
    post:
      tags: [Conta]
      summary: Mudar a empresa ativa (só empresas onde o utilizador tem associação ativa)
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "403": { description: NOT_A_MEMBER }
        "423": { description: TENANT_SUSPENDED }
  /api/v1/invitations/lookup/{token}:
    get:
      tags: [Utilizadores]
      summary: Dados públicos mínimos de um convite
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Empresa, perfil, email, validade }, "404": { description: INVITATION_INVALID } }
  /api/v1/invitations/accept:
    post:
      tags: [Utilizadores]
      summary: Aceitar convite (o email da conta tem de coincidir)
      requestBody: { content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
      responses: { "200": { description: OK }, "403": { description: INVITATION_EMAIL_MISMATCH }, "422": { description: INVITATION_INVALID } }

  /api/v1/company:
    get:
      tags: [Empresa]
      summary: Dados da empresa ativa (company.view)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Company" } } } } } } }
    put:
      tags: [Empresa]
      summary: Atualizar dados (company.update)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, country_code]
              properties:
                name: { type: string }
                legal_name: { type: string }
                nif: { type: string }
                email: { type: string }
                phone: { type: string }
                website: { type: string }
                address_line1: { type: string }
                address_line2: { type: string }
                postal_code: { type: string, example: "4000-123" }
                city: { type: string }
                country_code: { type: string, example: PT }
                timezone: { type: string, example: Europe/Lisbon }
      responses: { "200": { description: OK }, "403": { description: Sem permissão }, "422": { $ref: "#/components/responses/Validation" } }
  /api/v1/company/security:
    put:
      tags: [Empresa]
      summary: Exigir 2FA a todos os membros (security.manage; quem ativa tem de ter 2FA)
      requestBody: { content: { application/json: { schema: { type: object, properties: { require_mfa: { type: boolean } } } } } }
      responses: { "200": { description: OK }, "422": { description: MFA_REQUIRED_FOR_ADMIN } }
  /api/v1/company/logo:
    get: { tags: [Empresa], summary: Logótipo (ficheiro privado), responses: { "200": { description: Imagem }, "404": { description: Sem logótipo } } }
    post:
      tags: [Empresa]
      summary: Enviar logótipo PNG/JPG/WebP até 2 MB (company.update)
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { logo: { type: string, format: binary } } } } } }
      responses: { "200": { description: OK } }
    delete: { tags: [Empresa], summary: Remover logótipo, responses: { "200": { description: OK } } }

  /api/v1/members:
    get:
      tags: [Utilizadores]
      summary: Listar membros (members.view)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended] } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { "200": { description: Lista paginada de Member } }
  /api/v1/members/{membership}:
    patch:
      tags: [Utilizadores]
      summary: Alterar perfil, estado ou função (members.manage)
      parameters: [{ name: membership, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id: { type: integer }
                status: { type: string, enum: [active, suspended] }
                job_title: { type: string }
      responses: { "200": { description: OK }, "403": { description: ROLE_ESCALATION }, "404": { description: Não existe nesta empresa }, "422": { description: LAST_ADMIN / SELF_SUSPEND } }
    delete:
      tags: [Utilizadores]
      summary: Remover da empresa (a conta pessoal mantém-se)
      parameters: [{ name: membership, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: OK }, "422": { description: LAST_ADMIN } }
  /api/v1/invitations:
    get: { tags: [Utilizadores], summary: Convites (pending por omissão), responses: { "200": { description: Lista } } }
    post:
      tags: [Utilizadores]
      summary: Convidar (members.invite; conta para o limite de utilizadores)
      requestBody: { content: { application/json: { schema: { type: object, required: [email, role_id], properties: { email: { type: string }, role_id: { type: integer } } } } } }
      responses: { "201": { description: Criado; email enviado em fila }, "402": { description: PLAN_LIMIT_REACHED }, "403": { description: ROLE_ESCALATION }, "409": { description: ALREADY_MEMBER / INVITATION_PENDING } }
  /api/v1/invitations/{invitation}/resend:
    post: { tags: [Utilizadores], summary: Reenviar com novo token, parameters: [{ name: invitation, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: OK } } }
  /api/v1/invitations/{invitation}:
    delete: { tags: [Utilizadores], summary: Anular, parameters: [{ name: invitation, in: path, required: true, schema: { type: integer } }], responses: { "204": { description: OK } } }

  /api/v1/permissions:
    get: { tags: [Perfis], summary: Catálogo de permissões por módulo (roles.view), responses: { "200": { description: OK } } }
  /api/v1/roles:
    get: { tags: [Perfis], summary: Perfis da empresa (roles.view, members.invite ou members.manage), responses: { "200": { description: Lista de Role } } }
    post:
      tags: [Perfis]
      summary: Criar perfil (roles.manage; só com permissões que o próprio tem)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses: { "201": { description: Criado }, "403": { description: ROLE_ESCALATION } }
  /api/v1/roles/{role}:
    put:
      tags: [Perfis]
      summary: Editar perfil (o de administrador está bloqueado)
      parameters: [{ name: role, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses: { "200": { description: OK }, "403": { description: ROLE_LOCKED / ROLE_ESCALATION } }
    delete:
      tags: [Perfis]
      summary: Apagar perfil sem utilizadores nem convites
      parameters: [{ name: role, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: OK }, "409": { description: ROLE_IN_USE } }
  /api/v1/roles/{role}/reset:
    post: { tags: [Perfis], summary: Repor permissões do modelo, parameters: [{ name: role, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: OK } } }

  /api/v1/audit-logs:
    get:
      tags: [Auditoria]
      summary: Auditoria da empresa (audit.view)
      parameters:
        - { name: event, in: query, description: Prefixo (ex. auth, membership), schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { "200": { description: Lista paginada } }
  /api/v1/subscription:
    get: { tags: [Subscrição], summary: Subscrição atual e utilização vs limites (subscription.view), responses: { "200": { description: OK } } }
  /api/v1/support-grants:
    get: { tags: [Suporte], summary: Autorizações dadas ao suporte (support.manage), responses: { "200": { description: Lista } } }
    post:
      tags: [Suporte]
      summary: Autorizar acesso só de leitura (1–72 h)
      requestBody: { content: { application/json: { schema: { type: object, required: [reason, hours], properties: { reason: { type: string, minLength: 10 }, hours: { type: integer, minimum: 1, maximum: 72 } } } } } }
      responses: { "201": { description: Criada } }
  /api/v1/support-grants/{supportAccessGrant}:
    delete: { tags: [Suporte], summary: Revogar, parameters: [{ name: supportAccessGrant, in: path, required: true, schema: { type: integer } }], responses: { "204": { description: OK } } }
  /api/v1/exports:
    get: { tags: [Exportação], summary: Exportações (data.export), responses: { "200": { description: Lista } } }
    post: { tags: [Exportação], summary: Pedir exportação ZIP/JSON (também em modo só leitura), responses: { "201": { description: Em fila }, "409": { description: EXPORT_RUNNING } } }
  /api/v1/exports/{tenantExport}/download:
    get: { tags: [Exportação], summary: Descarregar (expira em 48 h; auditado), parameters: [{ name: tenantExport, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: application/zip }, "404": { description: Inexistente ou expirada } } }

  /api/v1/projects:
    get:
      tags: [Obras]
      summary: Obras visíveis (todas com projects.all; senão, as da equipa)
      parameters:
        - { name: search, in: query, description: "Nome, código ou localidade", schema: { type: string } }
        - { name: status, in: query, description: "open (preparação, em curso, suspensa) ou um estado", schema: { type: string, enum: [open, planning, active, suspended, completed, archived] } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { "200": { description: Lista paginada de Project } }
    post:
      tags: [Obras]
      summary: Criar obra (projects.create; quem cria entra na equipa; código OB-AAAA-NNN se vazio)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInput" } } } }
      responses: { "201": { description: Criada }, "402": { description: PLAN_LIMIT_REACHED (max_active_projects) } }
  /api/v1/projects/{project}:
    get: { tags: [Obras], summary: Obra (projects.view nesta obra), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: Project com permissions }, "403": { description: Fora da equipa }, "404": { description: Não existe nesta empresa } } }
    put:
      tags: [Obras]
      summary: Editar (projects.update); concluir, arquivar ou reabrir exige projects.archive
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInput" } } } }
      responses: { "200": { description: OK }, "402": { description: Reabrir acima do limite }, "409": { description: PROJECT_ARCHIVED } }
  /api/v1/projects/{project}/members:
    get: { tags: [Obras], summary: Equipa da obra (projects.view), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: Lista de ProjectMember } } }
    post:
      tags: [Obras]
      summary: Adicionar à equipa (projects.team); role_id vazio = perfil da empresa
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [membership_id], properties: { membership_id: { type: integer }, role_id: { type: integer } } } } } }
      responses: { "201": { description: Adicionado }, "403": { description: ROLE_ESCALATION }, "409": { description: ALREADY_IN_TEAM / PROJECT_ARCHIVED }, "422": { description: MEMBERSHIP_INACTIVE } }
  /api/v1/projects/{project}/members/options:
    get: { tags: [Obras], summary: Quem pode entrar e perfis que quem pede pode atribuir (projects.team), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: "{members, roles}" } } }
  /api/v1/projects/{project}/members/{member}:
    patch: { tags: [Obras], summary: Mudar o perfil na obra (projects.team), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: member, in: path, required: true, schema: { type: integer } }], requestBody: { content: { application/json: { schema: { type: object, required: [role_id], properties: { role_id: { type: integer } } } } } }, responses: { "200": { description: OK }, "403": { description: ROLE_ESCALATION } } }
    delete: { tags: [Obras], summary: Retirar da equipa (projects.team), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: member, in: path, required: true, schema: { type: integer } }], responses: { "204": { description: OK }, "403": { description: ROLE_ESCALATION } } }

  /api/v1/projects/{project}/diary:
    get:
      tags: [Diário de obra]
      summary: Registos (diary.view), do mais recente para o mais antigo
      parameters:
        - { name: project, in: path, required: true, schema: { type: integer } }
        - { name: month, in: query, description: AAAA-MM, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { "200": { description: Lista paginada (com items_count e workforce_total) } }
    post:
      tags: [Diário de obra]
      summary: Novo registo em rascunho (diary.write); um por dia, nunca no futuro
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/DiaryEntryInput" } } } }
      responses: { "201": { description: Criado }, "409": { description: PROJECT_ARCHIVED }, "422": { description: Dia já registado ou futuro } }
  /api/v1/projects/{project}/diary/{diaryEntry}:
    get: { tags: [Diário de obra], summary: Registo com linhas (diary.view), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: diaryEntry, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: OK }, "404": { description: Não pertence a esta obra } } }
    put:
      tags: [Diário de obra]
      summary: Alterar rascunho (diary.write); items, se vierem, substituem as linhas; a data não muda
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: diaryEntry, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/DiaryEntryInput" } } } }
      responses: { "200": { description: OK }, "409": { description: DIARY_SUBMITTED } }
    delete: { tags: [Diário de obra], summary: Apagar rascunho (diary.write), parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: diaryEntry, in: path, required: true, schema: { type: integer } }], responses: { "204": { description: OK }, "409": { description: DIARY_SUBMITTED } } }
  /api/v1/projects/{project}/diary/{diaryEntry}/submit:
    post: { tags: [Diário de obra], summary: Submeter (diary.submit); deixa de poder ser alterado, parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: diaryEntry, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: OK }, "409": { description: DIARY_SUBMITTED } } }

  /api/v1/projects/{project}/diary/{diaryEntry}/photos:
    post:
      tags: [Diário de obra]
      summary: Juntar fotografia a um rascunho (diary.write); multipart, um ficheiro por pedido
      parameters: [{ name: project, in: path, required: true, schema: { type: integer } }, { name: diaryEntry, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: "JPEG, PNG ou WebP (pelo conteúdo), até 20 MB" }
                caption: { type: string, maxLength: 255 }
      responses: { "201": { description: "Media (status processing ou ready)" }, "402": { description: PLAN_LIMIT_REACHED (storage_mb) }, "409": { description: DIARY_SUBMITTED / PROJECT_ARCHIVED }, "422": { description: Tipo, tamanho ou mais de 30 por registo }, "429": { description: Demasiados envios } }
  /api/v1/projects/{project}/diary/{diaryEntry}/photos/{photo}:
