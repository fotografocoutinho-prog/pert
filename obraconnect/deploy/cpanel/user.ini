; Valores recomendados para o ObraConnect.
; No cPanel: "MultiPHP INI Editor" (modo editor) para o domínio, ou copiar
; este ficheiro para a pasta pública com o nome .user.ini.

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 120
max_input_vars = 3000

display_errors = Off
log_errors = On
expose_php = Off

session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
