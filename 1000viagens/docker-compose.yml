services:
  site:
    build: .
    container_name: 1000viagens
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Mude esta password antes do primeiro arranque
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-mudar-esta-password}
      # Opcional — avisos de novos pedidos por e-mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./data:/app/data
