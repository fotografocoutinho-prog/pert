name: ObraConnect

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "obraconnect/**"
      - ".github/workflows/obraconnect.yml"
  pull_request:
    paths:
      - "obraconnect/**"
      - ".github/workflows/obraconnect.yml"

defaults:
  run:
    working-directory: obraconnect

jobs:
  test:
    name: Testes (PHP ${{ matrix.php }}, MySQL 8.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.4 é a versão do alojamento de produção (coda.pt).
        php: ["8.3", "8.4"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: obraconnect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, intl, fileinfo, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obraconnect/package-lock.json

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Dependências sem vulnerabilidades conhecidas
        run: composer audit --no-dev --no-interaction

      - name: Frontend (tipos e build)
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev
          npm run typecheck
          npm run build

      - name: Testes em SQLite
        run: php artisan test

      - name: Testes em MySQL 8.4
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: obraconnect_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - name: SQL de instalação atualizado e importável em MySQL 8.4
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: base64:b2JyYWNvbm5lY3QtY2hhdmUtc28tcGFyYS10ZXN0ZXM=
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE obraconnect_sql CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          # 1. O ficheiro no repositório corresponde às migrações atuais (ignorando datas).
          DB_DATABASE=obraconnect_sql php artisan obraconnect:install-sql /tmp/gerado.sql
          normalize() { sed -E "s/'[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}'/'TS'/g" "$1"; }
          diff <(normalize database/sql/obraconnect-install.sql) <(normalize /tmp/gerado.sql) \
            || { echo "::error::database/sql/obraconnect-install.sql desatualizado. Corra scripts/generate-install-sql.sh"; exit 1; }
          # 2. Importa num MySQL 8.4 vazio e confirma que o Laravel o vê como migrado.
          mysql -h 127.0.0.1 -uroot -proot obraconnect_sql < database/sql/obraconnect-install.sql
          DB_DATABASE=obraconnect_sql php artisan migrate --force | tee /tmp/migrate.log
          grep -q "Nothing to migrate" /tmp/migrate.log

      - name: Cópia de segurança da aplicação e restauro em MySQL 8.4
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: base64:b2JyYWNvbm5lY3QtY2hhdmUtc28tcGFyYS10ZXN0ZXM=
        run: |
          my() { mysql -h 127.0.0.1 -uroot -proot -N "$@"; }
          my -e "CREATE DATABASE obraconnect_bk CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE obraconnect_rs CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          # 1. Base com a empresa de demonstração (todas as áreas) e a cópia feita pela aplicação.
          DB_DATABASE=obraconnect_bk php artisan migrate --force --seed
          DB_DATABASE=obraconnect_bk php artisan obraconnect:demo
          DB_DATABASE=obraconnect_bk php artisan obraconnect:backup --no-files --path=/tmp/copias
          # 2. Restaura numa base vazia com o cliente normal e compara o conteúdo tabela a tabela.
          gunzip -c /tmp/copias/db-*.sql.gz | mysql -h 127.0.0.1 -uroot -proot obraconnect_rs
          n=0
          for t in $(my -e "select table_name from information_schema.tables where table_schema = 'obraconnect_bk' and table_type = 'BASE TABLE'"); do
            a=$(my -e "checksum table obraconnect_bk.\`$t\`" | awk '{print $2}')
            b=$(my -e "checksum table obraconnect_rs.\`$t\`" | awk '{print $2}')
            [ "$a" = "$b" ] || { echo "::error::Tabela $t diferente depois do restauro ($a ≠ $b)"; exit 1; }
            n=$((n + 1))
          done
          echo "Restauro igual ao original em $n tabelas."
          DB_DATABASE=obraconnect_rs php artisan migrate --force | tee /tmp/migrate-rs.log
          grep -q "Nothing to migrate" /tmp/migrate-rs.log

  release:
    name: ZIP de instalação (cPanel)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, zip, intl, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obraconnect/package-lock.json

      - name: Gerar ZIP
        run: scripts/build-release.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: obraconnect-release
          path: |
            obraconnect/dist/*.zip
            obraconnect/dist/*.sha256
          retention-days: 30
