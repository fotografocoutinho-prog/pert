<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signage Player</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #stage { position: fixed; inset: 0; }
      .layer {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 600ms ease;
        background: #000;
      }
      .layer.visible { opacity: 1; }
      .layer img, .layer video {
        max-width: 100%; max-height: 100%;
        width: 100%; height: 100%;
      }
      .fit img, .fit video { object-fit: contain; }
      .fill img, .fill video { object-fit: cover; }
      .stretch img, .stretch video { object-fit: fill; }
      #status {
        position: fixed; bottom: 12px; right: 16px;
        font: 12px/1.4 system-ui, sans-serif; color: #4ade80;
        opacity: 0.35; pointer-events: none; z-index: 10;
      }
      #splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #64748b; font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="splash">Connecting…</div>
    <div id="status"></div>
    <script src="./player.js"></script>
  </body>
</html>
